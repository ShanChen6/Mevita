services:
  postgres:
    image: postgres:17-alpine
    container_name: mevita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mevita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mevita}
      POSTGRES_DB: ${POSTGRES_DB:-mevita}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - mevita-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mevita} -d ${POSTGRES_DB:-mevita}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mevita-pgdata:
