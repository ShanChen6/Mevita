name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mevita
          POSTGRES_PASSWORD: mevita
          POSTGRES_DB: mevita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mevita -d mevita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mevita:mevita@localhost:5432/mevita?schema=public
      # Khoá chỉ dùng cho CI
      JWT_ACCESS_SECRET: ci-only-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm --filter @mevita/api test:e2e
      - run: pnpm build
